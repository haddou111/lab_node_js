<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Posts</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 20px auto; padding: 0 16px; }
        h1 { color: #333; }
        form { background: #f5f5f5; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
        button { padding: 8px 14px; margin: 4px 2px; cursor: pointer; }
        .post { border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .post h3 { margin: 0 0 6px; }
        .actions { margin-top: 8px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>Posts</h1>

    <form id="postForm">
        <h2 id="formTitle">Créer un post</h2>
        <input type="hidden" id="postId">
        <input type="number" id="userId" placeholder="userId" value="1" required>
        <input type="text" id="title" placeholder="Titre" required>
        <textarea id="body" placeholder="Contenu" rows="4" required></textarea>
        <button type="submit">Enregistrer</button>
        <button type="button" id="cancelBtn" style="display:none;">Annuler</button>
    </form>

    <div id="status"></div>
    <div id="posts"></div>

    <script>
        const API = 'http://localhost:3000/api/posts';
        const postsDiv = document.getElementById('posts');
        const statusDiv = document.getElementById('status');
        const form = document.getElementById('postForm');
        const formTitle = document.getElementById('formTitle');
        const postIdInput = document.getElementById('postId');
        const userIdInput = document.getElementById('userId');
        const titleInput = document.getElementById('title');
        const bodyInput = document.getElementById('body');
        const cancelBtn = document.getElementById('cancelBtn');

        async function loadPosts() {
            try {
                const res = await fetch(API);
                const posts = await res.json();
                postsDiv.innerHTML = '';
                if (!Array.isArray(posts) || posts.length === 0) {
                    postsDiv.innerHTML = '<p>Aucun post.</p>';
                    return;
                }
                posts.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <h3>#${p.id} - ${escapeHtml(p.title || '')}</h3>
                        <p><strong>User:</strong> ${p.userId ?? ''}</p>
                        <p>${escapeHtml(p.body || '')}</p>
                        <div class="actions">
                            <button onclick="editPost(${p.id})">Modifier</button>
                            <button onclick="deletePost(${p.id})">Supprimer</button>
                        </div>
                    `;
                    postsDiv.appendChild(div);
                });
            } catch (e) {
                statusDiv.innerHTML = '<p class="error">Erreur de chargement: ' + e.message + '</p>';
            }
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        window.editPost = async function(id) {
            const res = await fetch(API + '/' + id);
            const p = await res.json();
            postIdInput.value = p.id;
            userIdInput.value = p.userId ?? 1;
            titleInput.value = p.title || '';
            bodyInput.value = p.body || '';
            formTitle.textContent = 'Modifier le post #' + p.id;
            cancelBtn.style.display = 'inline-block';
        };

        window.deletePost = async function(id) {
            if (!confirm('Supprimer le post #' + id + ' ?')) return;
            await fetch(API + '/' + id, { method: 'DELETE' });
            loadPosts();
        };

        cancelBtn.addEventListener('click', () => {
            form.reset();
            postIdInput.value = '';
            formTitle.textContent = 'Créer un post';
            cancelBtn.style.display = 'none';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = postIdInput.value;
            const payload = {
                userId: Number(userIdInput.value),
                title: titleInput.value,
                body: bodyInput.value
            };
            let res;
            if (id) {
                res = await fetch(API + '/' + id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                res = await fetch(API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }
            if (res.ok) {
                form.reset();
                postIdInput.value = '';
                formTitle.textContent = 'Créer un post';
                cancelBtn.style.display = 'none';
                statusDiv.innerHTML = '<p>Opération réussie.</p>';
                loadPosts();
            } else {
                const err = await res.json();
                statusDiv.innerHTML = '<p class="error">' + (err.error || 'Erreur') + '</p>';
            }
        });

        loadPosts();
    </script>
</body>
</html>
